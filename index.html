        [data-theme="dark"][data-ui="washroom"] {
            --bg-base: #031417;

        * {

        body {
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;

            align-items: center;
            padding: clamp(10px, 3vw, 40px) 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- BACKGROUND RENDERING SYSTEM --- */
        .anime-sky-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--anime-sky);
            z-index: -3;
        }

        .anime-clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            opacity: var(--cloud-opacity);
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.35);
            filter: blur(35px);
            border-radius: 50%;
            animation: cloudFloat infinite linear;
        }
        .cloud-1 { width: 450px; height: 220px; top: 10%; left: -5%; background: rgba(255, 177, 160, 0.35); animation-duration: 90s; }
        .cloud-2 { width: 550px; height: 280px; bottom: 5%; right: -10%; background: rgba(255, 234, 167, 0.25); animation-duration: 120s; }
        [data-theme="dark"] .cloud-1 { background: rgba(139, 92, 246, 0.15); }
        [data-theme="dark"] .cloud-2 { background: rgba(244, 63, 94, 0.1); }

        @keyframes cloudFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, 15px); }
        }

        .star-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
            display: var(--star-display);
            pointer-events: none;
        }

        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: shooting infinite linear;
            opacity: 0;
        }
        .star-1 { top: 7%; left: 25%; animation-duration: 7s; animation-delay: 1s; }
        .star-2 { top: 18%; left: 65%; animation-duration: 9s; animation-delay: 4s; }

        @keyframes shooting {
            0% { transform: translate(0,0) scale(1); opacity: 0; }
            8% { opacity: 1; }
            28% { transform: translate(-250px, 250px) scale(0.3); opacity: 0; }
        }

        .bubble-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
            display: var(--bubble-display);
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            animation: floatUp infinite linear;
        }
        [data-theme="dark"] .bubble { background: rgba(0, 242, 254, 0.08); border-color: rgba(0, 242, 254, 0.25); }

        .b1 { width: 35px; height: 35px; left: 10%; animation-duration: 13s; }
        .b2 { width: 20px; height: 20px; left: 45%; animation-duration: 17s; animation-delay: 1.5s; }
        .b3 { width: 45px; height: 45px; left: 80%; animation-duration: 14s; animation-delay: 4s; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
        }

        /* --- CONTAINER WORKSPACE --- */
        .container {
            width: 100%;
            max-width: 1150px;
            background: var(--panel-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: var(--border-glass);
            border-radius: 28px;
            padding: clamp(15px, 4vw, 40px);
            box-shadow: var(--neon-glow);
            position: relative;
            z-index: 1;
        }

        .header-top-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .hub-navigation {
            display: flex;
            background: var(--card-glass);
            border: var(--border-glass);
            border-radius: 16px;
            padding: 5px;
            gap: 5px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 420px;
        }

        .nav-tab {
            flex: 1;
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            border-radius: 12px;
            white-space: nowrap;
        }

        .nav-tab.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 191, 165, 0.15);
        }

        .top-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: var(--card-glass);
            border: var(--border-glass);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--card-shadow);
        }

        .control-btn:hover {
            transform: translateY(-1px);
        }

        .download-btn { background: linear-gradient(135deg, #00b894, #00cec9); color: white; border: none; }
        .download-btn:hover { background: linear-gradient(135deg, #00cec9, #00b894); }

        header { margin-bottom: clamp(20px, 4vw, 35px); }
        header h1 {
            font-family: 'Comfortaa', sans-serif;
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        header p { color: var(--text-muted); font-size: clamp(12px, 2vw, 14px); font-weight: 500; }

        /* Compact Parameter Setup Bar */
        .setup-section { 
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px; 
            margin-bottom: 30px; 
            align-items: end;
        }

        @media (max-width: 650px) {
            .setup-section { grid-template-columns: 1fr; }
        }

        .form-group { width: 100%; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }

        select, input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: var(--border-glass);
            background: var(--card-glass);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            box-shadow: var(--card-shadow);
        }

        .gen-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary-gradient);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 191, 165, 0.15);
        }
        .gen-btn:hover { transform: translateY(-1px); }

        /* Unified Layout grid (Web) */
        .results-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 25px; 
        }

        .panel-stats {
            background: var(--card-glass);
            border-radius: 20px;
            padding: 22px;
            border: var(--border-glass);
            box-shadow: var(--card-shadow);
        }

        .panel-stats h2 {
            font-family: 'Comfortaa', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--text-main);
        }

        .summary-list { 
            list-style: none; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); 
            gap: 12px; 
        }
        
        .summary-list li {
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 12px 14px;
            background: var(--bg-base); 
            border-radius: 14px; 
            border: var(--border-glass); 
            box-shadow: var(--card-shadow);
            min-height: 70px;
        }

        .summary-list li .name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
        }

        .summary-list li span.count {
            align-self: flex-start;
            font-weight: 800; 
            color: white; 
            background: var(--primary-gradient); 
            padding: 3px 8px; 
            border-radius: 8px; 
            font-size: 10px;
            margin-top: 6px;
        }

        /* Schedule Calendar Section */
        .panel-schedule {
            background: var(--card-glass);
            border-radius: 20px;
            padding: 22px;
            border: var(--border-glass);
            box-shadow: var(--card-shadow);
        }

        .panel-schedule h2 {
            font-family: 'Comfortaa', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--text-main);
        }

        /* Responsive Duty Card Grid for Web Screen */
        .schedule-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .duty-card {
            background: var(--card-bg-duty);
            border: var(--border-glass);
            border-radius: 14px;
            padding: 12px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .duty-card .card-header-day {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 3px;
            margin-bottom: 2px;
        }

        .duty-item-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .duty-item-row .icon-lbl {
            font-size: 13px;
        }

        .duty-item-row .name-lbl {
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* --- HIGH RESOLUTION TEMPORARY CAPTURE TEMPLATE --- */
        #exportCanvasContainer {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1200px;
            padding: 40px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            color: var(--text-main);
            box-sizing: border-box;
        }

        #exportCanvasContainer .export-header {
            text-align: center;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            padding-bottom: 20px;
        }

        #exportCanvasContainer .export-header h1 {
            font-family: 'Comfortaa', sans-serif;
            font-size: 40px;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #exportCanvasContainer .export-header p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 5px;
        }

        #exportCanvasContainer .export-section-title {
            font-family: 'Comfortaa', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        #exportCanvasContainer .export-grid-wrapper {
            background: rgba(15, 10, 32, 0.45);
            backdrop-filter: blur(20px);
            border: var(--border-glass);
            border-radius: 18px;
            padding: 25px;
        }

            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        #exportCanvasContainer .export-stats-item {
            background: rgba(255, 255, 255, 0.15);

            font-weight: 700;

        }

        #exportCanvasContainer .export-stats-item .count {
            display: inline-block;
            background: #fff;
            color: #2d3436;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            margin-top: 6px;
        }

        #exportCanvasContainer .export-schedule-grid {

            grid-template-columns: repeat(5, 1fr);
            gap: 10px;

            padding-bottom: 3px;

        }

<body>

<div class="anime-sky-bg"></div>

<div class="container">

        <div class="hub-navigation">
            <button class="nav-tab active" id="tabMarket" onclick="switchMode('market')">🛒 Market Duty</button>
            <button class="nav-tab" id="tabWashroom" onclick="switchMode('washroom')">🧼 Washroom Duty</button>

        <div class="top-controls">
            <button class="control-btn download-btn hidden" onclick="downloadDashboardAsImage()" id="downloadBtn">✨ Export Image</button>
            <button class="control-btn" onclick="toggleTheme()" id="themeBtn">🌌 Twilight UI</button>
        </dit);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 3px;
            margin-bottom: 2px;
        }

        .duty-item-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;

        .duty-item-row .icon-lbl {

        /* --- HIGH RESOLUTION TEMPORARY CAPTURE TEMPLATE --- */
        #exportCanvasContainer {
            position: absolute;
            left: -9999px;

            width: 1200px;
            padding: 40px;

            display: flex;
            flex-direction: column;

            box-sizing: border-box;
        }

        #exportCanvasContainer .export-header {
            text-align: center;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            padding-bottom: 20px;
        }

        #exportCanvasContainer .export-header h1 {
            font-family: 'Comfortaa', sans-serif;
            font-size: 40px;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #exportCanvasContainer .export-header p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 5px;
        }

        #exportCanvasContainer .export-section-title {
            font-family: 'Comfortaa', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        #exportCanvasContainer .export-grid-wrapper {
            background: rgba(15, 10, 32, 0.45);
            backdrop-filter: blur(20px);
            border: var(--border-glass);
            border-radius: 18px;
            padding: 25px;
        }

        #exportCanvasContainer .export-stats-list {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        #exportCanvasContainer .export-stats-item {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        #exportCanvasContainer .export-stats-item .name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        #exportCanvasContainer .export-stats-item .count {
            display: inline-block;
            background: #fff;
            color: #2d3436;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            margin-top: 6px;
        }

        #exportCanvasContainer .export-schedule-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        #exportCanvasContainer .export-day-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 10px;
            color: #2d3436;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #exportCanvasContainer .export-day-card .day-num {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 3px;
            margin-bottom: 4px;
        }

        .hidden { display: none !important; }

<body>

<div class="anime-sky-bg"></div>
<div class="anime-clouds"><div class="cloud cloud-1"></div><div class="cloud cloud-2"></div></div>
<div class="star-container"><div class="shooting-star star-1"></div><div class="shooting-star star-2"></div></div>
<div class="bubble-container"><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div></div>

<div class="container">
    <div class="header-top-group">
        <div class="hub-navigation">
            <button class="nav-tab active" id="tabMarket" onclick="switchMode('market')">🛒 Market Duty</button>
            <button class="nav-tab" id="tabWashroom" onclick="switchMode('washroom')">🧼 Washroom Duty</button>
        </div>

        <div class="top-controls">
            <button class="control-btn download-btn hidden" onclick="downloadDashboardAsImage()" id="downloadBtn">✨ Export Image</button>
            <button class="control-btn" onclick="toggleTheme()" id="themeBtn">🌌 Twilight UI</button>
        </div>
    </div>

    <header>
        <h1 id="hubTitle">Mess Marketing Hub</h1>
        <p id="hubSubtitle">Equal spell distribution engine for 11 members (2 meals/day)</p>
    </header>

    <div class="setup-section">
        <div class="form-group">
            <label for="monthSelect">Target Month</label>
            <select id="monthSelect"></select>
        </div>
        
        <div class="form-group">
            <label for="yearInput">Target Year</label>
            <input type="number" id="yearInput" value="2026" min="2020" max="2100">
        </div>

        <div class="form-group">
            <button class="gen-btn" id="actionBtn" onclick="generateSchedule()">☄️ Run Distribution</button>
        </div>
    </div>

    <div class="results-grid hidden" id="resultsGrid">
        <!-- Live Statistics Panel -->
        <div class="panel-stats">
            <h2 id="statsHeading">💫 Fair Contribution Stats</h2>
            <ul class="summary-list" id="summaryList"></ul>
        </div>

        <!-- Live Calendar Card Grid -->
        <div class="panel-schedule">
            <h2 id="tableHeading">📅 Duty Chart Calendar</h2>
            <div class="schedule-cards-grid" id="scheduleCardsBody"></div>
        </div>
    </div>
</div>

<!-- TEMPORARY HIDDEN EXPORT CANVAS FOR HIGH-RES DOWNLOADS -->
<div id="exportCanvasContainer">
    <div class="export-header">
        <h1 id="exportTitle">Mess Duty Chart</h1>
        <p id="exportSubtitle">Balanced and equal task distribution system</p>
    </div>
    <div class="export-grid-wrapper">
        <div class="export-section-title" id="exportStatsHeader">📊 Roster Statistics</div>
        <div class="export-stats-list" id="exportStatsList"></div>
    </div>
    <div class="export-grid-wrapper">
        <div class="export-section-title" id="exportScheduleHeader">📅 Scheduled Calendar Days</div>
        <div class="export-schedule-grid" id="exportScheduleGrid"></div>
    </div>
</div>

<script>
    let currentMode = 'market';
    const members = ["Sandip", "Bishal", "Durjoy", "Sudip", "Hridoy", "Prottoy", "Hrittick", "Noyon", "Arup", "Rahul", "Sourov"];
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    // Global arrays to preserve state for high-res exporter
    let processedDutyData = []; 
    let finalStatsCounts = {};
    let activeMonthLabel = "";

    // Emojis mapping structures
    const marketEmojis = ["🌸", "❄️", "🌱", "☀️", "🌿", "☔", "🌾", "☁️", "🍁", "🎃", "🍂", "🎄"];
    const washroomEmojis = ["🧼", "🪣", "🧽", "🚿", "💧", "🌊", "🧴", "🧹", "🧊", "🫧", "💦", "🌪️"];

    function populateMonthsDropdown() {
        const select = document.getElementById("monthSelect");
        const previousValue = select.value || "1"; 
        select.innerHTML = "";
        const currentEmojis = currentMode === 'market' ? marketEmojis : washroomEmojis;

        for (let i = 0; i < 12; i++) {
            const opt = document.createElement("option");
            opt.value = i + 1;
            opt.innerText = `${currentEmojis[i]} ${monthNames[i]}`;
            if(String(i + 1) === previousValue) {
                opt.selected = true;
            }
            select.appendChild(opt);
        }
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const targetTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", targetTheme);
        document.getElementById("themeBtn").innerHTML = targetTheme === "dark" ? "☀️ Light UI" : "🌌 Twilight UI";
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById("resultsGrid").classList.add("hidden");
        document.getElementById("downloadBtn").classList.add("hidden");
        document.documentElement.setAttribute("data-ui", mode);

        populateMonthsDropdown();

        if(mode === 'market') {
            document.getElementById("tabMarket").classList.add("active");
            document.getElementById("tabWashroom").classList.remove("active");
            document.getElementById("hubTitle").innerText = "Mess Marketing Hub";
            document.getElementById("hubSubtitle").innerText = "Equal spell distribution engine for 11 members (2 meals/day)";
            document.getElementById("actionBtn").innerText = "☄️ Run Distribution";
        } else {
            document.getElementById("tabWashroom").classList.add("active");
            document.getElementById("tabMarket").classList.remove("active");
            document.getElementById("hubTitle").innerText = "Washroom Cleaning Engine";
            document.getElementById("hubSubtitle").innerText = "4-day continuous deep cleaning with balanced 10-day cycles";
            document.getElementById("actionBtn").innerText = "🧼 Generate Cycles";
        }
    }

    function isLeapYear(year) {
        return (year % 4 === 0 && year % 100 != 0) || (year % 400 === 0);
    }

    function getDaysInMonth(month, year) {
        if (month === 2) return isLeapYear(year) ? 29 : 28;
        if ([4, 6, 9, 11].includes(month)) return 30;
        return 31;
    }

    function addDays(d, m, y, amt) {
        d += amt;
        while (d > getDaysInMonth(m, y)) {
            d -= getDaysInMonth(m, y);
            m++;
            if (m > 12) { m = 1; y++; }
        }
        return { day: d, month: m, year: y };
    }

    function formatDate(d, m, y) {
        return `${String(d).padStart(2, '0')} ${monthNames[m - 1]}`;
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateSchedule() {
        const month = parseInt(document.getElementById("monthSelect").value);
        const year = parseInt(document.getElementById("yearInput").value) || 2026;
        const selectEl = document.getElementById("monthSelect");
        activeMonthLabel = selectEl.options[selectEl.selectedIndex].text;
        
        if(currentMode === 'market') {
            runMarketLogic(month, year);
        } else {
            runWashroomLogic(month, year);
        }

        document.getElementById("resultsGrid").classList.remove("hidden");
        document.getElementById("downloadBtn").classList.remove("hidden");
    }

    function runMarketLogic(month, year) {
        const days = getDaysInMonth(month, year);
        const totalSlots = days * 2;
        const numMembers = members.length;

        const baseDuties = Math.floor(totalSlots / numMembers);
        const remainder = totalSlots % numMembers;
        let spellLengths = new Array(numMembers).fill(baseDuties);

        let indices = Array.from({length: numMembers}, (_, i) => i);
        shuffleArray(indices);
        for (let i = 0; i < remainder; i++) spellLengths[indices[i]]++;

        let shuffledOrder = [...members];
        shuffleArray(shuffledOrder);

        let dutyPool = [];
        for (let i = 0; i < numMembers; i++) {
            for (let j = 0; j < spellLengths[i]; j++) dutyPool.push(shuffledOrder[i]);
        }

        processedDutyData = [];
        let poolIndex = 0;
        for (let d = 1; d <= days; d++) {
            processedDutyData.push({
                type: 'market',
                dayText: `Day ${d}`,
                lunch: dutyPool[poolIndex++],
                dinner: dutyPool[poolIndex++]
            });
        }

        // Stats Calc
        finalStatsCounts = {};
        members.forEach(m => finalStatsCounts[m] = 0);
        dutyPool.forEach(m => finalStatsCounts[m]++);

        // Web view display
        document.getElementById("tableHeading").innerText = "📋 Daily Marketing Grid View";
        document.getElementById("statsHeading").innerText = "💫 Market Contribution Stats";
        
        const scheduleCardsBody = document.getElementById("scheduleCardsBody");
        scheduleCardsBody.innerHTML = "";

        processedDutyData.forEach(item => {
            const card = `
                <div class="duty-card">
                    <div class="card-header-day">${item.dayText}</div>
                    <div class="duty-item-row">
                        <span class="icon-lbl">☀️</span>
                        <span class="name-lbl" title="${item.lunch}">${item.lunch}</span>
                    </div>
                    <div class="duty-item-row">
                        <span class="icon-lbl">🌙</span>
                        <span class="name-lbl" title="${item.dinner}">${item.dinner}</span>
                    </div>
                </div>
            `;
            scheduleCardsBody.insertAdjacentHTML('beforeend', card);
        });

        const statsList = document.getElementById("summaryList");
        statsList.innerHTML = "";
        members.forEach(m => {
            statsList.insertAdjacentHTML('beforeend', `<li><div class="name">${m}</div><span class="count">${finalStatsCounts[m]} Duties</span></li>`);
        });
    }

    function runWashroomLogic(startMonth, startYear) {
        let memberObjects = members.map(name => ({ name: name, cleaned: 0 }));
        let currentDay = 1, currentMonth = startMonth, currentYear = startYear;

        const cleanDays = 4, totalCycle = 10, roundsToShow = 2;

        processedDutyData = [];

        for (let round = 1; round <= roundsToShow; round++) {
            let minClean = Math.min(...memberObjects.map(m => m.cleaned));
            let eligibleIndices = [];
            memberObjects.forEach((m, idx) => { if(m.cleaned === minClean) eligibleIndices.push(idx); });

            shuffleArray(eligibleIndices);
            if (eligibleIndices.length % 2 === 1) { eligibleIndices.push(eligibleIndices[0]); }

            for (let i = 0; i < eligibleIndices.length; i += 2) {
                let a = eligibleIndices[i], b = eligibleIndices[i + 1];
                let startD = currentDay, startM = currentMonth, startY = currentYear;
                let endDateObj = addDays(startD, startM, startY, cleanDays - 1);

                processedDutyData.push({
                    type: 'washroom',
                    roundText: `R${round} • Pair ${(i/2)+1}`,
                    durationText: `${formatDate(startD, startM, startY)} ➔ ${formatDate(endDateObj.day, endDateObj.month, endDateObj.year)}`,
                    partnerA: memberObjects[a].name,
                    partnerB: memberObjects[b].name
                });

                memberObjects[a].cleaned++; 
                memberObjects[b].cleaned++;
                let nextCycleDate = addDays(currentDay, currentMonth, currentYear, totalCycle);
                currentDay = nextCycleDate.day; 
                currentMonth = nextCycleDate.month; 
                currentYear = nextCycleDate.year;
            }
        }

        finalStatsCounts = {};
        memberObjects.forEach(m => finalStatsCounts[m.name] = m.cleaned);

        document.getElementById("tableHeading").innerText = "🧼 Cycle Cards (4 Days Active Duty)";
        document.getElementById("statsHeading").innerText = "🌟 Total Round Scorecard";

        const scheduleCardsBody = document.getElementById("scheduleCardsBody");
        scheduleCardsBody.innerHTML = "";

        processedDutyData.forEach(item => {
            const card = `
                <div class="duty-card">
                    <div class="card-header-day" style="color: var(--accent);">${item.roundText}</div>
                    <div style="font-size: 10px; opacity: 0.8; margin-bottom: 5px;">${item.durationText}</div>
                    <div class="duty-item-row">
                        <span class="icon-lbl">✨</span>
                        <span class="name-lbl" style="font-weight:700;">${item.partnerA}</span>
                    </div>
                    <div class="duty-item-row">
                        <span class="icon-lbl">✨</span>
                        <span class="name-lbl" style="font-weight:700;">${item.partnerB}</span>
                    </div>
                </div>
            `;
            scheduleCardsBody.insertAdjacentHTML('beforeend', card);
        });

        const statsList = document.getElementById("summaryList");
        statsList.innerHTML = "";
        memberObjects.forEach(m => {
            statsList.insertAdjacentHTML('beforeend', `<li><div class="name">${m.name}</div><span class="count">${m.cleaned} Cycles</span></li>`);
        });
    }

    function downloadDashboardAsImage() {
        // Step 1: Render values dynamically in high-res hidden template in memory
        const exportTitle = document.getElementById("exportTitle");
        const exportSubtitle = document.getElementById("exportSubtitle");
        const exportStatsList = document.getElementById("exportStatsList");
        const exportScheduleGrid = document.getElementById("exportScheduleGrid");

        if(currentMode === 'market') {
            exportTitle.innerText = `Mess Marketing Schedule`;
            exportSubtitle.innerText = `Duty distribution roster for ${activeMonthLabel} 2026 (2 meals/day)`;
            document.getElementById("exportStatsHeader").innerText = "📊 Market Contribution Stats";
            document.getElementById("exportScheduleHeader").innerText = "📅 Assigned Daily Calendar Grid";
        } else {
            exportTitle.innerText = `Washroom Deep Cleaning Schedule`;
            exportSubtitle.innerText = `Balanced 10-day cycles beginning ${activeMonthLabel} 2026`;
            document.getElementById("exportStatsHeader").innerText = "🌟 Total Round Scorecard";
            document.getElementById("exportScheduleHeader").innerText = "🧼 Active Cycle Timeline Cards";
        }

        // Render stats on hidden sheet
        exportStatsList.innerHTML = "";
        members.forEach(member => {
            const textValue = currentMode === 'market' ? `${finalStatsCounts[member]} Meals` : `${finalStatsCounts[member]} Cycles`;
            const statsItem = `
                <div class="export-stats-item">
                    <div class="name">${member}</div>
                    <div class="count">${textValue}</div>
                </div>
            `;
            exportStatsList.insertAdjacentHTML('beforeend', statsItem);
        });

        // Render cards on hidden grid sheet
        exportScheduleGrid.innerHTML = "";
        processedDutyData.forEach(item => {
            let cardTemplate = "";
            if(item.type === 'market') {
                cardTemplate = `
                    <div class="export-day-card">
                        <div class="day-num">${item.dayText}</div>
                        <div class="duty-item-row" style="color: #2d3436; margin-bottom: 4px;">
                            <span>☀️</span> <strong style="margin-left: 4px; font-size: 11px;">${item.lunch}</strong>
                        </div>
                        <div class="duty-item-row" style="color: #2d3436;">
                            <span>🌙</span> <strong style="margin-left: 4px; font-size: 11px;">${item.dinner}</strong>
                        </div>
                    </div>
                `;
            } else {
                cardTemplate = `
                    <div class="export-day-card" style="border-left: 3px solid #00bfa5;">
                        <div class="day-num" style="color: #00bfa5;">${item.roundText}</div>
                        <div style="font-size: 9px; opacity: 0.7; color: #636e72; margin-bottom: 5px;">${item.durationText}</div>
                        <div class="duty-item-row" style="color: #2d3436; margin-bottom: 3px;">
                            <span>✨</span> <strong style="margin-left: 3px; font-size: 11px;">${item.partnerA}</strong>
                        </div>
                        <div class="duty-item-row" style="color: #2d3436;">
                            <span>✨</span> <strong style="margin-left: 3px; font-size: 11px;">${item.partnerB}</strong>
                        </div>
                    </div>
                `;
            }
            exportScheduleGrid.insertAdjacentHTML('beforeend', cardTemplate);
        });

        const currentTheme = document.documentElement.getAttribute("data-theme");
        let renderingBGColor = currentTheme === "dark" ? "#060613" : "#f0f4f9";
        if(currentMode === 'washroom') {
            renderingBGColor = currentTheme === "dark" ? "#031417" : "#eef9f6";
        }

        // Render the offline graphic block
        const exportTarget = document.getElementById("exportCanvasContainer");
        html2canvas(exportTarget, {
            backgroundColor: renderingBGColor,
            scale: 2,
            useCORS: true,
            logging: false
        }).then(canvas => {
            const link = document.createElement("a");
            link.href = canvas.toDataURL("image/png");
            link.download = `${currentMode === 'market' ? 'Market' : 'Washroom'}_Schedule_2026.png`;
            link.click();
        });
    }

    window.onload = function() {
        populateMonthsDropdown();
    };
</script>

</body>
